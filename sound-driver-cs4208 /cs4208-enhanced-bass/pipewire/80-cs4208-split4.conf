{
  "context.objects": [
    {
      "factory": "adapter",
      "flags": [
        "nofail"
      ],
      "args": {
        "factory.name": "api.alsa.pcm.sink",
        "node.name": "cs4208.bass",
        "node.description": "CS4208 Bass Stereo",
        "media.class": "Audio/Sink",
        "api.alsa.path": "hw:PCH,2",
        "api.alsa.disable-mmap": true,
        "audio.format": "S16LE",
        "audio.rate": 48000,
        "audio.allowed-rates": [
          48000
        ],
        "audio.channels": 2,
        "audio.position": [
          "FL",
          "FR"
        ],
        "priority.session": 10,
        "session.suspend-timeout-seconds": 5,
        "adapter.auto-port-config": {
          "mode": "dsp",
          "monitor": false,
          "position": "preserve"
        }
      }
    }
  ],
  "context.modules": [
    {
      "name": "libpipewire-module-combine-stream",
      "flags": [
        "nofail"
      ],
      "args": {
        "combine.mode": "sink",
        "node.name": "cs4208.split4",
        "node.description": "MB Speakers 4ch",
        "combine.latency-compensate": true,
        "combine.props": {
          "audio.rate": 48000,
          "audio.channels": 4,
          "audio.position": [
            "FL",
            "FR",
            "RL",
            "RR"
          ],
          "priority.session": 10
        },
        "stream.props": {
          "stream.dont-remix": true
        },
        "stream.rules": [
          {
            "matches": [
              {
                "media.class": "Audio/Sink",
                "node.name": "alsa_output.pci-0000_00_1b.0.analog-stereo"
              }
            ],
            "actions": {
              "create-stream": {
                "combine.audio.position": [
                  "FL",
                  "FR"
                ],
                "audio.position": [
                  "FL",
                  "FR"
                ]
              }
            }
          },
          {
            "matches": [
              {
                "media.class": "Audio/Sink",
                "node.name": "cs4208.bass"
              }
            ],
            "actions": {
              "create-stream": {
                "combine.audio.position": [
                  "RL",
                  "RR"
                ],
                "audio.position": [
                  "FL",
                  "FR"
                ]
              }
            }
          }
        ]
      }
    }
  ]
}
