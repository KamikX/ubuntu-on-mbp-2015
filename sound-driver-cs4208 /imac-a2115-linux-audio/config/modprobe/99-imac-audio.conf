# The CS8409's I2C bridge -- the path by which the TAS5764 amplifiers are
# programmed -- is powered from the HDA controller. When runtime power
# management suspends the controller, that bridge goes with it: the codec's
# resume handler is never called, amplifier programming silently does nothing,
# and the machine plays digital silence with no error anywhere.
#
# See https://github.com/davidjo/snd_hda_macbookpro/issues/209 (same machine).
options snd_hda_intel power_save=0 power_save_controller=N
