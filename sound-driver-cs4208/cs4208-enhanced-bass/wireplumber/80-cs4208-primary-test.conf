{
  "monitor.alsa.rules": [
    {
      "matches": [
        { "node.name": "alsa_output.pci-0000_00_1b.0.analog-stereo" }
      ],
      "actions": {
        "update-props": {
          "audio.format": "S16LE",
          "audio.rate": 48000,
          "audio.allowed-rates": [48000],
          "api.alsa.disable-mmap": true
        }
      }
    }
  ]
}
